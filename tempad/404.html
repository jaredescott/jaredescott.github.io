<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TemPad</title>
    <script>
      // GitHub Pages: keep OAuth query/hash when normalizing /tempad → /tempad/
      var base = '/tempad/';
      var loc = window.location;
      var target = loc.origin + base + (loc.search || '') + (loc.hash || '');
      if (loc.pathname !== base && loc.pathname !== base.slice(0, -1)) {
        loc.replace(target);
      } else if (!loc.pathname.endsWith('/') && loc.pathname.indexOf('tempad') !== -1) {
        loc.replace(target);
      } else {
        loc.replace(loc.origin + base + (loc.search || '') + (loc.hash || ''));
      }
    </script>
  </head>
  <body></body>
</html>
